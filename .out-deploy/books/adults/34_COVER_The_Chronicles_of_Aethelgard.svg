<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="300" fill="url(#bg)"/>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="170" cy="60" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="50" cy="100" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="150" cy="130" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="25" cy="180" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="175" cy="200" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="80" cy="250" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="130" cy="280" r="1.5" fill="#fff" opacity="0.5"/>
  
  <!-- Central Star/Stone -->
  <polygon points="100,30 115,70 155,70 125,95 140,135 100,110 60,135 75,95 45,70 85,70" fill="url(#star)" filter="url(#glow)"/>
  
  <!-- Title -->
  <text x="100" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#e94560">The Chronicles</text>
  <text x="100" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#ffd700">of Aethelgard</text>
  
  <!-- Subtitle -->
  <text x="100" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff" opacity="0.8">An Epic Fantasy Adventure</text>
  
  <!-- Decorative line -->
  <line x1="40" y1="235" x2="160" y2="235" stroke="#e94560" stroke-width="1" opacity="0.6"/>
  
  <!-- Author placeholder -->
  <text x="100" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#fff" opacity="0.6">A Tale of Two Worlds</text>
</svg>
