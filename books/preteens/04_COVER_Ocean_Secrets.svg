<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#oceGrad)"/>
  
  <!-- Underwater elements -->
  <circle cx="100" cy="150" r="60" fill="#0288d1" opacity="0.6"/>
  <circle cx="280" cy="200" r="80" fill="#0277bd" opacity="0.5"/>
  
  <!-- Coral -->
  <path d="M 80 400 Q 70 350 80 300" stroke="#d84315" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 120 420 Q 130 360 120 300" stroke="#e64a19" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 320 450 Q 310 380 320 320" stroke="#d84315" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Fish -->
  <g transform="translate(150, 280)">
    <ellipse cx="0" cy="0" rx="30" ry="18" fill="#ffd54f"/>
    <polygon points="30,0 50,-8 50,8" fill="#ffd54f"/>
    <circle cx="-20" cy="-8" r="3" fill="#000"/>
  </g>
  
  <g transform="translate(250, 350)">
    <ellipse cx="0" cy="0" rx="25" ry="15" fill="#ff9800"/>
    <polygon points="25,0 40,-6 40,6" fill="#ff9800"/>
    <circle cx="-18" cy="-7" r="2.5" fill="#000"/>
  </g>
  
  <!-- Treasure chest -->
  <rect x="150" y="450" width="100" height="60" rx="5" fill="#8b6914"/>
  <rect x="150" y="450" width="100" height="30" fill="#a0522d"/>
  <circle cx="175" cy="475" r="4" fill="#ffd700"/>
  <circle cx="200" cy="475" r="4" fill="#ffd700"/>
  <circle cx="225" cy="475" r="4" fill="#ffd700"/>
  
  <!-- Title -->
  <rect x="30" y="480" width="340" height="100" fill="#000" opacity="0.7" rx="10"/>
  <text x="200" y="525" font-size="44" font-weight="bold" text-anchor="middle" fill="#1976d2" font-family="Arial">Ocean Secrets</text>
  <text x="200" y="560" font-size="16" text-anchor="middle" fill="#fff" font-family="Arial">Dive Into Mystery and Adventure</text>
</svg>